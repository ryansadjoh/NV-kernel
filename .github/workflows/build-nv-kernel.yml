name: Build nv-kernel Lavender 4.4 CAF (SukiSU + SuFS)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL Repo Kernel 4.4 CAF (Kosongkan untuk pencarian otomatis)'
        required: false
        default: ''
      repo_branch:
        description: 'Branch 4.4 CAF (Opsional)'
        required: false
        default: ''

jobs:
  build-nv-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex \
            libelf-dev clang lld git ccache zip curl jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch 4.4 CAF Kernel Source & Toolchain
        run: |
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            BRANCH_ARG=""
            if [ -n "${{ github.event.inputs.repo_branch }}" ]; then
              BRANCH_ARG="-b ${{ github.event.inputs.repo_branch }}"
            fi
            git clone --depth=1 $BRANCH_ARG "${{ github.event.inputs.repo_url }}" source
          else
            echo "Searching for best 4.4 CAF lavender kernel..."
            REPO=$(curl -s "https://api.github.com/search/repositories?q=android_kernel_xiaomi_lavender&sort=stars&per_page=1" | jq -r '.items[0].clone_url // empty')
            if [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
              REPO="https://github.com/Yasir-siddiqui/android_kernel_xiaomi_lavender.git"
            fi
            echo "Using repo: $REPO"
            git clone --depth=1 "$REPO" source
          fi

          # Fetch Proton Clang Toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Inject SukiSU, SuFS & Set Kernel Name
        run: |
          cd source
          git clone --depth=1 https://github.com/gmh5225/KernelSU-4.4 KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
          sed -i 's/return -ENOSYS$/return -ENOSYS;/' KernelSU/kernel/core_hook.c

          CONF=$(basename $(find arch/arm64/configs/ -name "*lavender*" -o -name "*perf_defconfig" | head -n 1))
          echo "Target CAF Defconfig: $CONF"

          # Spoof branding: gaya stock Samsung Galaxy S9/S9+ (kernel 4.4 stock)
          # 1. Hilangkan suffix tanggal di setlocalversion (dimodifikasi repo sumber: -$(date +%m-%d))
          sed -i 's/-$(date "+%m-%d")//' scripts/setlocalversion
          grep -n 'CONFIG_LOCALVERSION\|date' scripts/setlocalversion | tail -3 || true
          # 2. Hapus jejak compiler Proton clang → ganti dengan gcc style Samsung era 2018 (S9/Galaxy Note 9)
          sed -i 's|\$CC -v 2>&1|echo "gcc version 4.9.4 20150123 (prerelease) (GCC)"|' scripts/mkcompile_h
          echo "Compiler spoofed check:" && grep -n 'gcc version 4.9.4' scripts/mkcompile_h | head -1 || true
          touch .scmversion
          echo 'CONFIG_LOCALVERSION="-19761338"' >> arch/arm64/configs/$CONF
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$CONF
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$CONF

      - name: Patch stpcpy for LTO/lld link
        run: |
          cd source
          sed -i 's@#endif /\* _LINUX_STRING_H_ \*/@extern char *stpcpy(char *__restrict__ dest, const char *__restrict__ src);\n\n#endif /* _LINUX_STRING_H_ */@' include/linux/string.h
          cat >> lib/string.c <<'EOF'

          /**
           * stpcpy - copy a string from src to dest returning a pointer to the new end
           *          of dest, including src's %NUL-terminator. May overrun dest.
           * @dest: pointer to end of string being copied into.
           * @src: pointer to the beginning of string being copied from.
           */
          char *stpcpy(char *__restrict__ dest, const char *__restrict__ src)
          {
              while ((*dest++ = *src++) != '\0')
                  /* nothing */;
              return --dest;
          }
          EXPORT_SYMBOL(stpcpy);
          EOF

      - name: Compile nv-kernel
        run: |
          cd source
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Spoof builder info di /proc/version (gaya Samsung build farm)
          export KBUILD_BUILD_USER=release
          export KBUILD_BUILD_HOST=21BBA028

          CONF=$(basename $(find arch/arm64/configs/ -name "*lavender*" -o -name "*perf_defconfig" | head -n 1))

          make O=out ARCH=arm64 $CONF
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon"

      - name: Package to AnyKernel3 ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=nv-kernel by ryansadjoh
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          dump_boot;

          write_boot;
          ## end boot install
          EOF
          if [ -f "../source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f "../source/out/arch/arm64/boot/Image.gz" ]; then
            cp ../source/out/arch/arm64/boot/Image.gz .
          fi
          zip -r9 ../nv-kernel-Lavender-4.4-CAF-SukiSU-SuFS.zip * -x .git README.md

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nv-kernel-Lavender-4.4-CAF
          path: nv-kernel-Lavender-4.4-CAF-SukiSU-SuFS.zip
